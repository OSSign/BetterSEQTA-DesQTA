name: Build and Package (Tauri Windows)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'The source branch or ref to build from'
        default: 'main'
        required: true
      release_name:
        description: 'The name for the release'
        required: true

jobs:
  release:
    runs-on: windows-latest
    environment: OSSign

    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'BetterSEQTA/DesQTA'
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 1

      - uses: ossign/ossign@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          installOnly: true

      - name: Fix tauri signing command
        shell: bash
        run: |
          OSSIGN_PATH=$(find /c/hostedtoolcache/windows/ossign-Windows -name ossign.exe | head -1)
          OSSIGN_WIN=$(cygpath -w "$OSSIGN_PATH")
          
          # Write a PowerShell sign script
          cat > src-tauri/sign.ps1 << EOF
          \$file = \$args[0]
          if (\$file -match '\.msi$') {
              & '${OSSIGN_WIN}' -t msi -o \$file \$file
          } else {
              & '${OSSIGN_WIN}' -t pecoff -o \$file \$file
          }
          EOF

          # Set signCommand to invoke the ps1 script
          jq '.bundle.windows.signCommand = "powershell.exe -File src-tauri/sign.ps1 %1"' \
             src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
      
          jq '.plugins.updater.pubkey = "$TAURI_SIGNING_PUBLIC_KEY"' \
             src-tauri/tauri.conf.json.tmp > src-tauri/tauri.conf.json
      
          rm src-tauri/tauri.conf.json.tmp
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install

      - name: Generate app icons
        run: pnpm tauri icon static/app-icon.svg
      
      - name: Build Windows
        shell: bash
        env:
          OSSIGN_CONFIG: ${{ secrets.OSSIGN_CONFIG }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
            src-tauri/target/x86_64-pc-windows-msvc/release/*.sig
            README.md
          name: ${{ github.event.inputs.release_name }}
          tag_name: ${{ github.run_id }}
          body: |
            # Signed Release ${{ github.event.inputs.release_name }}
            
            These are the distributable files for the signed release of DesQTA ${{ github.event.inputs.release_name }}

            The source code was fetched from https://github.com/BetterSEQTA/DesQTA@${{ github.event.inputs.source_branch }}
