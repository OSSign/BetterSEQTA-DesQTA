name: Build and Package (Tauri Windows)
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'The source branch or ref to build from'
        default: 'main'
        required: true
      release_name:
        description: 'The name for the release'
        required: true
jobs:
  release:
    runs-on: windows-latest
    environment: OSSign
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'BetterSEQTA/DesQTA'
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install

      - name: Generate app icons
        run: pnpm tauri icon static/app-icon.svg

      - name: Install OSSign CLI
        uses: ossign/ossign@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: ${{ secrets.OSSIGN_CONFIG }}
          installOnly: true

      - name: Prepare Tauri bundler signing (OSSign)
        shell: pwsh
        env:
          OSSIGN_CONFIG_BODY: ${{ secrets.OSSIGN_CONFIG }}
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $cfgPath = Join-Path $ws 'ossign-ci-config.yaml'
          Set-Content -LiteralPath $cfgPath -Value $env:OSSIGN_CONFIG_BODY -Encoding utf8

          $scriptPath = Join-Path $ws 'ossign-tauri-sign.ps1'
          @(
            'param([Parameter(Mandatory)][string]$SignedPath)',
            '',
            '$config = $env:OSSIGN_CONFIG_PATH',
            'if (-not $config -or -not (Test-Path -LiteralPath $config)) {',
            '  Write-Error "OSSIGN_CONFIG_PATH is not set or config file is missing."',
            '  exit 1',
            '}',
            '',
            '$cmd = Get-Command ossign -ErrorAction SilentlyContinue',
            'if (-not $cmd) {',
            '  Write-Error "ossign executable was not found on PATH."',
            '  exit 1',
            '}',
            '',
            '$ext = [System.IO.Path]::GetExtension($SignedPath).ToLowerInvariant()',
            '$sigType = if ($ext -eq ''.msi'') { ''msi'' } else { ''pecoff'' }',
            '',
            '& ossign -c $config -t $sigType -i $SignedPath -o $SignedPath',
            'exit $LASTEXITCODE'
          ) | Set-Content -LiteralPath $scriptPath -Encoding utf8

          $signCmd = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`" -SignedPath `"%1`""
          $mergeObj = [PSCustomObject]@{
            bundle = [PSCustomObject]@{
              windows = [PSCustomObject]@{
                signCommand = $signCmd
              }
            }
          }
          $mergePath = Join-Path $ws 'src-tauri/tauri-windows-sign.merge.json'
          $mergeObj | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $mergePath -Encoding utf8

      - name: Build Windows (OSSign during bundle via signCommand)
        shell: pwsh
        env:
          OSSIGN_CONFIG_PATH: ${{ github.workspace }}/ossign-ci-config.yaml
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          pnpm tauri build --target x86_64-pc-windows-msvc --config src-tauri/tauri-windows-sign.merge.json

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $fail = $false
          Get-ChildItem -Path $release -Recurse -Include *.exe, *.msi -File -ErrorAction SilentlyContinue | ForEach-Object {
            $sig = Get-AuthenticodeSignature -FilePath $_.FullName
            Write-Host "$($_.FullName): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error file=$($_.FullName)::Authenticode status $($sig.StatusMessage)"
              $fail = $true
            }
          }
          if ($fail) {
            exit 1
          }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
            src-tauri/target/x86_64-pc-windows-msvc/release/*.sig
            README.md
          name: ${{ github.event.inputs.release_name }}
          tag_name: ${{ github.run_id }}
          body: |
            # Signed Release ${{ github.event.inputs.release_name }}

            These are the distributable files for the signed release of DesQTA ${{ github.event.inputs.release_name }}
            The source code was fetched from https://github.com/StroepWafel/DesQTA@${{ github.event.inputs.source_branch }}
