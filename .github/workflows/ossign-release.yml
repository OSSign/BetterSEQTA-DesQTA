name: Build and Package (Tauri Windows)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'The source branch or ref to build from'
        default: 'main'
        required: true
      release_name:
        description: 'The name for the release'
        required: true

jobs:
  release:
    runs-on: windows-latest
    environment: OSSign

    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'BetterSEQTA/DesQTA'
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 1

      - uses: ossign/ossign@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          installOnly: true

      - name: Fix tauri signing command
        shell: pwsh
        run: |
          $tauriConfPath = "src-tauri/tauri.conf.json"
          $tauriConf = Get-Content -Raw -Path $tauriConfPath | ConvertFrom-Json

          # Use a Windows-native signing command to avoid bash.exe dependency on runner PATH.
          $tauriConf.bundle.windows.signCommand = 'powershell -ExecutionPolicy Bypass -File src-tauri/sign.ps1 "%1"'
          if ($env:TAURI_SIGNING_PUBLIC_KEY) {
            $tauriConf.plugins.updater.pubkey = $env:TAURI_SIGNING_PUBLIC_KEY
          }

          $tauriConf | ConvertTo-Json -Depth 100 | Set-Content -Encoding UTF8 -Path $tauriConfPath

          @'
          param(
            [Parameter(Mandatory = $true)]
            [string]$File
          )

          $ErrorActionPreference = "Stop"
          $ossign = (Get-Command ossign.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $ossign) {
            $fallback = Get-ChildItem -Path "C:/hostedtoolcache/windows/ossign-Windows" -Filter "ossign.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $fallback) {
              throw "ossign.exe not found in PATH or hostedtoolcache."
            }
            $ossign = $fallback.FullName
          }

          if ($File.ToLower().EndsWith(".msi")) {
            & $ossign -t msi -o "$File" "$File"
          } else {
            & $ossign -t pecoff -o "$File" "$File"
          }
          '@ | Set-Content -Encoding UTF8 -Path "src-tauri/sign.ps1"
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install

      - name: Generate app icons
        run: pnpm tauri icon static/app-icon.svg
      
      - name: Build Windows
        shell: pwsh
        env:
          OSSIGN_CONFIG: ${{ secrets.OSSIGN_CONFIG }}
          OSSIGN_CONFIG_BASE64: ${{ secrets.OSSIGN_CONFIG_BASE64 || secrets.OSSIGN_CONFIG }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
            src-tauri/target/x86_64-pc-windows-msvc/release/*.sig
            README.md
          name: ${{ github.event.inputs.release_name }}
          tag_name: ${{ github.run_id }}
          body: |
            # Signed Release ${{ github.event.inputs.release_name }}
            
            These are the distributable files for the signed release of DesQTA ${{ github.event.inputs.release_name }}

            The source code was fetched from https://github.com/BetterSEQTA/DesQTA@${{ github.event.inputs.source_branch }}
