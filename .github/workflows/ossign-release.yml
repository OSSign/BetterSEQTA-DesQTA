name: Build and Package (Tauri Windows)
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'The source branch or ref to build from'
        default: 'main'
        required: true
      release_name:
        description: 'The name for the release'
        required: true
jobs:
  release:
    runs-on: windows-latest
    environment: OSSign
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'BetterSEQTA/DesQTA'
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install

      - name: Generate app icons
        run: pnpm tauri icon static/app-icon.svg

      - name: Build Windows (no bundle)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Sign executables
        uses: ossign/ossign@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: ${{ secrets.OSSIGN_CONFIG }}
          inputFiles: |
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
    
      - name: Bundle application
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri bundle --target x86_64-pc-windows-msvc

      - name: Sign executables
        uses: ossign/ossign@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: ${{ secrets.OSSIGN_CONFIG }}
          inputFiles: |
            src-tauri/target/x86_64-pc-windows-msvc/release/**/*.exe
      
      - name: Sign executables (MSI)
        uses: ossign/ossign@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: ${{ secrets.OSSIGN_CONFIG }}
          fileType: 'msi'
          inputFiles: |
            src-tauri/target/x86_64-pc-windows-msvc/release/**/*.msi


      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
            src-tauri/target/x86_64-pc-windows-msvc/release/*.sig
            README.md
          name: ${{ github.event.inputs.release_name }}
          tag_name: ${{ github.run_id }}
          body: |
            # Signed Release ${{ github.event.inputs.release_name }}
            
            These are the distributable files for the signed release of DesQTA ${{ github.event.inputs.release_name }}
            The source code was fetched from https://github.com/StroepWafel/DesQTA@${{ github.event.inputs.source_branch }}
