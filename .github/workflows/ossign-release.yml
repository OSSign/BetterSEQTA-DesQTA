name: Build and Package (Tauri Windows)
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'The source branch or ref to build from'
        default: 'main'
        required: true
      release_name:
        description: 'The name for the release'
        required: true
jobs:
  release:
    runs-on: windows-latest
    environment: OSSign
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'BetterSEQTA/DesQTA'
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 1

      - name: Checkout companion repo
        uses: actions/checkout@v4
        with:
          path: ossign

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install

      - name: Generate app icons
        run: pnpm tauri icon static/app-icon.svg

      - name: Build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install OSSign CLI
        uses: ossign/ossign@main
        id: ossign
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          installOnly: true

      - name: Build Windows (no bundle)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OSSIGN_CONFIG: ${{ secrets.OSSIGN_CONFIG }}
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --config ossign/tauri-windows-sign.merge.json

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          # This will fail because there are a bunch of non-project binaries in the release folder that belong to other projects, those will not be signed by Tauri by default
          # e.g. wix\x64\wix\torch.exe
          $release = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/x86_64-pc-windows-msvc/release'
          Get-ChildItem -Path $release -Recurse -Include *.exe, *.msi -File -ErrorAction SilentlyContinue | ForEach-Object {
            $sig = Get-AuthenticodeSignature -FilePath $_.FullName
            Write-Host "$($_.FullName): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error file=$($_.FullName)::Authenticode status $($sig.StatusMessage)"
            }
          }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
            src-tauri/target/x86_64-pc-windows-msvc/release/*.sig
            README.md
          name: ${{ github.event.inputs.release_name }}
          tag_name: ${{ github.run_id }}
          body: |
            # Signed Release ${{ github.event.inputs.release_name }}
            
            These are the distributable files for the signed release of DesQTA ${{ github.event.inputs.release_name }}
            The source code was fetched from https://github.com/BetterSEQTA/DesQTA @${{ github.event.inputs.source_branch }}
