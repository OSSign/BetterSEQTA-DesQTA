name: Build and Package (Tauri Windows)
on:
  push:
    branches:
      - ossign

jobs:
  release:
    runs-on: windows-latest-4x
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'BetterSEQTA/DesQTA'
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install

      - name: Generate app icons
        run: pnpm tauri icon static/app-icon.svg

      - name: Install OSSign CLI
        uses: ossign/ossign@main
        id: ossign
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          installOnly: true

      - name: Build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Windows (OSSign during bundle via signCommand)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Still just the same example config, no real secrets here
          OSSIGN_CONFIG_BASE64: 
        run: |
          ossign.exe --help
          cp ossign/tauri-windows-sign.merge.json src-tauri/
          pnpm tauri build --target x86_64-pc-windows-msvc --config src-tauri/tauri-windows-sign.merge.json

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $fail = $false
          Get-ChildItem -Path $release -Recurse -Include *.exe, *.msi -File -ErrorAction SilentlyContinue | ForEach-Object {
            $sig = Get-AuthenticodeSignature -FilePath $_.FullName
            Write-Host "$($_.FullName): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error file=$($_.FullName)::Authenticode status $($sig.StatusMessage)"
              $fail = $true
            }
          }
          if ($fail) {
            exit 1
          }

